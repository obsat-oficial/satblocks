<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="c3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Placa Central ESP32-C3 SuperMini -->
  <g transform="translate(260, 40)" filter="url(#shadow)">
    <!-- PCB -->
    <rect x="0" y="0" width="240" height="300" rx="14" fill="url(#c3bg)" stroke="#6366f1" stroke-width="2.5"/>
    
    <!-- Conector USB-C no topo -->
    <rect x="80" y="-12" width="80" height="26" rx="6" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="92" y="-6" width="56" height="14" rx="4" fill="#1e293b"/>

    <!-- Antena Cerâmica / PCB -->
    <rect x="25" y="24" width="190" height="35" rx="4" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
    <path d="M 40 42 L 70 42 L 70 32 L 100 32 L 100 42 L 130 42 L 130 32 L 160 32 L 160 42 L 200 42" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

    <!-- Chip ESP32-C3 -->
    <rect x="55" y="80" width="130" height="130" rx="8" fill="url(#chipGrad)" stroke="#475569" stroke-width="2"/>
    <text x="120" y="125" fill="#38bdf8" font-size="16" font-weight="900" font-family="Inter, sans-serif" text-anchor="middle">ESP32-C3</text>
    <text x="120" y="145" fill="#a5b4fc" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">RISC-V 160MHz</text>
    <text x="120" y="165" fill="#10b981" font-size="10" font-weight="700" font-family="monospace" text-anchor="middle">Wi-Fi + BLE 5.0</text>
    <text x="120" y="185" fill="#cbd5e1" font-size="9" font-weight="600" font-family="monospace" text-anchor="middle">SuperMini PocketQube</text>

    <!-- Botões Boot / Reset -->
    <rect x="35" y="245" width="40" height="24" rx="4" fill="#334155" stroke="#64748b"/>
    <text x="55" y="261" fill="#fff" font-size="9" font-weight="800" text-anchor="middle">BOOT</text>

    <rect x="165" y="245" width="40" height="24" rx="4" fill="#334155" stroke="#64748b"/>
    <text x="185" y="261" fill="#fff" font-size="9" font-weight="800" text-anchor="middle">RST</text>

    <!-- LED Status -->
    <circle cx="120" cy="240" r="5" fill="#3b82f6"/>
    <text x="120" y="260" fill="#93c5fd" font-size="8" font-weight="700" text-anchor="middle">LED (IO8)</text>

    <!-- Pinos Lado Esquerdo -->
    <g transform="translate(10, 80)">
      <circle cx="0" cy="0" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="20" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="40" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="60" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="80" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="100" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="120" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="140" r="5" fill="url(#gold)"/>
    </g>

    <!-- Pinos Lado Direito -->
    <g transform="translate(230, 80)">
      <circle cx="0" cy="0" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="20" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="40" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="60" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="80" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="100" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="120" r="5" fill="url(#gold)"/>
      <circle cx="0" cy="140" r="5" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Legendas Esquerda -->
  <g transform="translate(40, 100)" font-family="Inter, monospace" font-size="11" font-weight="700">
    <rect x="0" y="5" width="200" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="190" y="21" fill="#1e40af" text-anchor="end">GPIO 0 (ADC1_CH0)</text>

    <rect x="0" y="32" width="200" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="190" y="48" fill="#1e40af" text-anchor="end">GPIO 1 (ADC1_CH1)</text>

    <rect x="0" y="59" width="200" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="190" y="75" fill="#1e40af" text-anchor="end">GPIO 2 (ADC1_CH2)</text>

    <rect x="0" y="86" width="200" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="190" y="102" fill="#1e40af" text-anchor="end">GPIO 3 (ADC1_CH3)</text>

    <rect x="0" y="113" width="200" height="24" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="190" y="129" fill="#86198f" text-anchor="end">GPIO 4 (SPI SCK)</text>

    <rect x="0" y="140" width="200" height="24" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="190" y="156" fill="#86198f" text-anchor="end">GPIO 5 (SPI MISO)</text>

    <rect x="0" y="167" width="200" height="24" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="190" y="183" fill="#86198f" text-anchor="end">GPIO 6 (SPI MOSI)</text>

    <rect x="0" y="194" width="200" height="24" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="190" y="210" fill="#86198f" text-anchor="end">GPIO 7 (SPI CS)</text>
  </g>

  <!-- Legendas Direita -->
  <g transform="translate(520, 100)" font-family="Inter, monospace" font-size="11" font-weight="700">
    <rect x="0" y="5" width="200" height="24" rx="4" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="10" y="21" fill="#0e7490">GPIO 8 (I2C SDA)</text>

    <rect x="0" y="32" width="200" height="24" rx="4" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="10" y="48" fill="#0e7490">GPIO 9 (I2C SCL)</text>

    <rect x="0" y="59" width="200" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="10" y="75" fill="#15803d">GPIO 10 (UART RX)</text>

    <rect x="0" y="86" width="200" height="24" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="10" y="102" fill="#15803d">GPIO 20 (UART TX)</text>

    <rect x="0" y="113" width="200" height="24" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="10" y="129" fill="#b91c1c">3V3 (Alimentação)</text>

    <rect x="0" y="140" width="200" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="10" y="156" fill="#334155">GND (Terra)</text>

    <rect x="0" y="167" width="200" height="24" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="10" y="183" fill="#c2410c">5V (VBUS USB)</text>

    <rect x="0" y="194" width="200" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="10" y="210" fill="#334155">GND (Terra)</text>
  </g>
</svg>
