<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <!-- Gradiente de PCB Aeroespacial -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradiente Dourado dos Contatos Castellated -->
    <linearGradient id="goldPad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gradiente Metálico Chip RP2040 -->
    <linearGradient id="rpChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente Conector USB-C -->
    <linearGradient id="usbcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Gradiente LED RGB WS2812 -->
    <linearGradient id="ws2812Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Sombra Suave de Elevação -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Limpo e Elegante com Borda Arredondada -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="14"/>

  <!-- CABEÇALHO DO DIAGRAMA -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0f172a">WAVESHARE RP2040-ZERO</text>
    <text x="0" y="20" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">PINAGEM OFICIAL WIKI WAVESHARE &amp; BARRAMENTOS OBSAT 2026</text>
    <rect x="670" y="-14" width="170" height="22" rx="11" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="755" y="1" font-family="Inter, monospace" font-size="10" font-weight="800" fill="#0891b2" text-anchor="middle">I2C0: BMP280 + MPU6050</text>
  </g>

  <!-- ======================================================== -->
  <!-- PLACA CENTRAL WAVESHARE RP2040-ZERO                      -->
  <!-- ======================================================== -->
  <g transform="translate(360, 65)" filter="url(#cardShadow)">
    <!-- Substrato PCB Azul Escuro / Preto Waveshare -->
    <rect x="0" y="0" width="200" height="420" rx="16" fill="url(#pcbGrad)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Conector USB-C Metálico no Topo -->
    <rect x="62" y="-16" width="76" height="32" rx="7" fill="url(#usbcGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="74" y="-8" width="52" height="16" rx="4" fill="#0f172a"/>
    <text x="100" y="3" font-family="Inter, monospace" font-size="8" font-weight="800" fill="#94a3b8" text-anchor="middle">USB-C</text>

    <!-- Botão BOOT e Botão RESET -->
    <rect x="25" y="30" width="38" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="44" cy="40" r="4.5" fill="#e2e8f0"/>
    <text x="44" y="58" font-family="Inter, monospace" font-size="7.5" font-weight="800" fill="#94a3b8" text-anchor="middle">BOOT</text>

    <rect x="137" y="30" width="38" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="156" cy="40" r="4.5" fill="#e2e8f0"/>
    <text x="156" y="58" font-family="Inter, monospace" font-size="7.5" font-weight="800" fill="#94a3b8" text-anchor="middle">RESET</text>

    <!-- LED RGB WS2812 (NeoPixel Onboard no GP16 DIN) -->
    <rect x="85" y="44" width="30" height="30" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="100" cy="59" r="8" fill="url(#ws2812Grad)"/>
    <text x="100" y="85" font-family="Inter, sans-serif" font-size="7.5" font-weight="900" fill="#f472b6" text-anchor="middle">RGB (GP16 DIN)</text>

    <!-- CHIP PROCESSADOR RASPBERRY PI RP2040 -->
    <rect x="45" y="105" width="110" height="110" rx="10" fill="url(#rpChip)" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Raspberry Pi Logo -->
    <circle cx="100" cy="132" r="9" fill="#c026d3"/>
    <circle cx="95" cy="127" r="3.5" fill="#e879f9"/>
    <circle cx="105" cy="127" r="3.5" fill="#e879f9"/>
    <circle cx="95" cy="136" r="3.5" fill="#e879f9"/>
    <circle cx="105" cy="136" r="3.5" fill="#e879f9"/>
    <path d="M 98 122 Q 100 117 102 122" stroke="#4ade80" stroke-width="1.8" fill="none"/>
    <text x="100" y="160" font-family="Inter, sans-serif" font-size="13" font-weight="900" fill="#38bdf8" text-anchor="middle">RP2040</text>
    <text x="100" y="174" font-family="Inter, monospace" font-size="8" font-weight="700" fill="#94a3b8" text-anchor="middle">Dual Cortex-M0+</text>
    <text x="100" y="187" font-family="Inter, monospace" font-size="8" font-weight="700" fill="#38bdf8" text-anchor="middle">133MHz / 264KB</text>
    <text x="100" y="199" font-family="Inter, monospace" font-size="7.5" font-weight="700" fill="#fbbf24" text-anchor="middle">4MB W25Q32 Flash</text>

    <!-- PADS TRASEIROS/INFERIORES (GP17-GP25 & GND) -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="160" height="135" rx="8" fill="#020617" stroke="#1e293b" stroke-dasharray="3 3"/>
      <text x="80" y="15" font-family="Inter, monospace" font-size="7.5" font-weight="700" fill="#64748b" text-anchor="middle">PADS VERSO (GP17-GP25 / GND)</text>

      <g transform="translate(10, 24)">
        <circle cx="15" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="15" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GND</text>

        <circle cx="45" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="45" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP25</text>

        <circle cx="75" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="75" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP24</text>

        <circle cx="105" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="105" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP23</text>

        <circle cx="130" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="130" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP22</text>
      </g>

      <g transform="translate(10, 60)">
        <circle cx="15" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="15" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#38bdf8" text-anchor="middle">GP21</text>

        <circle cx="45" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="45" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#38bdf8" text-anchor="middle">GP20</text>

        <circle cx="75" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="75" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP19</text>

        <circle cx="105" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="105" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP18</text>

        <circle cx="130" cy="10" r="5" fill="url(#goldPad)"/>
        <text x="130" y="24" font-family="Inter, monospace" font-size="6.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">GP17</text>
      </g>
    </g>

    <text x="100" y="395" font-family="Inter, monospace" font-size="9" font-weight="900" fill="#0284c7" text-anchor="middle">WAVESHARE RP2040-Zero</text>

    <!-- PINOS LATERAIS ESQUERDOS (Castellated: 5V, GND, 3V3, GP29-GP26, GP15, GP14) -->
    <g transform="translate(2, 60)">
      <rect x="0" y="0" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="26" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="52" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="78" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="104" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="130" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="156" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="182" width="10" height="12" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="208" width="10" height="12" rx="3" fill="url(#goldPad)"/>
    </g>

    <!-- PINOS LATERAIS DIREITOS (Castellated: GP0 a GP13) -->
    <g transform="translate(188, 60)">
      <rect x="0" y="0" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="22" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="44" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="66" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="88" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="110" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="132" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="154" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="176" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="198" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="220" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="242" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="264" width="10" height="10" rx="3" fill="url(#goldPad)"/>
      <rect x="0" y="286" width="10" height="10" rx="3" fill="url(#goldPad)"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ETIQUETAS DO LADO ESQUERDO (5V, GND, 3V3, GP29-GP26, GP15, GP14) -->
  <!-- ======================================================== -->
  <g transform="translate(30, 115)" font-family="Inter, -apple-system, sans-serif" font-size="10.5">
    <!-- 5V -->
    <g transform="translate(0, 0)">
      <rect width="310" height="22" rx="5" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="300" y="15" font-weight="800" fill="#c2410c" text-anchor="end">5V (Entrada VBUS USB / Alimentação)</text>
    </g>
    <!-- GND -->
    <g transform="translate(0, 26)">
      <rect width="310" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="300" y="15" font-weight="800" fill="#334155" text-anchor="end">GND (Terra Geral 0V)</text>
    </g>
    <!-- 3V3 -->
    <g transform="translate(0, 52)">
      <rect width="310" height="22" rx="5" fill="#fef2f2" stroke="#fecaca"/>
      <text x="300" y="15" font-weight="800" fill="#b91c1c" text-anchor="end">3V3 (VCC BMP280 / MPU6050)</text>
    </g>
    <!-- GP29 / ADC3 -->
    <g transform="translate(0, 78)">
      <rect width="310" height="22" rx="5" fill="#fefce8" stroke="#facc15"/>
      <text x="300" y="15" font-weight="800" fill="#854d0e" text-anchor="end">GP29: ADC3 (Entrada Analógica 3)</text>
    </g>
    <!-- GP28 / ADC2 -->
    <g transform="translate(0, 104)">
      <rect width="310" height="22" rx="5" fill="#fefce8" stroke="#facc15"/>
      <text x="300" y="15" font-weight="800" fill="#854d0e" text-anchor="end">GP28: ADC2 (Divisor Bateria EPS / LiPo)</text>
    </g>
    <!-- GP27 / ADC1 -->
    <g transform="translate(0, 130)">
      <rect width="310" height="22" rx="5" fill="#fefce8" stroke="#facc15"/>
      <text x="300" y="15" font-weight="800" fill="#854d0e" text-anchor="end">GP27: ADC1 (Sensor Radiação UV / I2C1 SCL)</text>
    </g>
    <!-- GP26 / ADC0 -->
    <g transform="translate(0, 156)">
      <rect width="310" height="22" rx="5" fill="#fefce8" stroke="#facc15"/>
      <text x="300" y="15" font-weight="800" fill="#854d0e" text-anchor="end">GP26: ADC0 (Sensor Luminosidade LDR Solar)</text>
    </g>
    <!-- GP15 -->
    <g transform="translate(0, 182)">
      <rect width="310" height="22" rx="5" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="300" y="15" font-weight="700" fill="#6d28d9" text-anchor="end">GP15: I2C1 SCL / SPI1 TX</text>
    </g>
    <!-- GP14 -->
    <g transform="translate(0, 208)">
      <rect width="310" height="22" rx="5" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="300" y="15" font-weight="700" fill="#6d28d9" text-anchor="end">GP14: I2C1 SDA / SPI1 SCK</text>
    </g>

    <!-- BOX DE DESTAQUE: ADC & SENSOR INTERNO -->
    <g transform="translate(0, 250)">
      <rect width="310" height="85" rx="8" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
      <text x="14" y="20" font-weight="900" font-size="11" fill="#854d0e">🔋 CANAIS ANALÓGICOS &amp; TÉRMICO</text>
      <text x="14" y="38" font-weight="600" font-size="9.5" fill="#a16207">• ADC0-ADC3: Entradas Analógicas 16-bits</text>
      <text x="14" y="54" font-weight="600" font-size="9.5" fill="#a16207">• ADC4: Sensor Térmico Interno do Silício</text>
      <text x="14" y="70" font-weight="800" font-size="9.5" fill="#0284c7">• WS2812 RGB Onboard: GP16 DIN</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ETIQUETAS DO LADO DIREITO (GP0 a GP13)                   -->
  <!-- ======================================================== -->
  <g transform="translate(580, 115)" font-family="Inter, -apple-system, sans-serif" font-size="10.5">
    <!-- GP0 - I2C0 SDA -->
    <g transform="translate(0, 0)">
      <rect width="310" height="20" rx="4" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="10" y="14" font-weight="900" fill="#0891b2">GP0: I2C0 SDA ➔ BMP280 + MPU6050</text>
    </g>
    <!-- GP1 - I2C0 SCL -->
    <g transform="translate(0, 22)">
      <rect width="310" height="20" rx="4" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="10" y="14" font-weight="900" fill="#0891b2">GP1: I2C0 SCL ➔ BMP280 + MPU6050</text>
    </g>
    <!-- GP2 -->
    <g transform="translate(0, 44)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP2: SPI0 SCK (LoRa Clock) / I2C1 SDA</text>
    </g>
    <!-- GP3 -->
    <g transform="translate(0, 66)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP3: SPI0 TX / MOSI (LoRa) / I2C1 SCL</text>
    </g>
    <!-- GP4 -->
    <g transform="translate(0, 88)">
      <rect width="310" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="14" font-weight="700" fill="#15803d">GP4: UART1 TX (GPS) / SPI0 RX / I2C0 SDA</text>
    </g>
    <!-- GP5 -->
    <g transform="translate(0, 110)">
      <rect width="310" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="10" y="14" font-weight="700" fill="#15803d">GP5: UART1 RX (GPS) / SPI0 CSn / I2C0 SCL</text>
    </g>
    <!-- GP6 -->
    <g transform="translate(0, 132)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP6: LoRa RESET / PWM Atuador</text>
    </g>
    <!-- GP7 -->
    <g transform="translate(0, 154)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP7: LoRa DIO0 (Interrupção de Rádio)</text>
    </g>
    <!-- GP8 -->
    <g transform="translate(0, 176)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP8: I2C0 SDA Auxiliar / UART1 TX</text>
    </g>
    <!-- GP9 -->
    <g transform="translate(0, 198)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP9: I2C0 SCL Auxiliar / UART1 RX</text>
    </g>
    <!-- GP10 -->
    <g transform="translate(0, 220)">
      <rect width="310" height="20" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
      <text x="10" y="14" font-weight="700" fill="#a21caf">GP10: PWM Buzzer Resgate / I2C1 SDA</text>
    </g>
    <!-- GP11 -->
    <g transform="translate(0, 242)">
      <rect width="310" height="20" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
      <text x="10" y="14" font-weight="700" fill="#a21caf">GP11: Payload Digital / I2C1 SCL</text>
    </g>
    <!-- GP12 -->
    <g transform="translate(0, 264)">
      <rect width="310" height="20" rx="4" fill="#fef2f2" stroke="#fecaca"/>
      <text x="10" y="14" font-weight="700" fill="#b91c1c">GP12: Filamento Térmico Abertura Antena</text>
    </g>
    <!-- GP13 -->
    <g transform="translate(0, 286)">
      <rect width="310" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="10" y="14" font-weight="700" fill="#1d4ed8">GP13: Sensor DHT22 / 1-Wire / Expansão</text>
    </g>

    <!-- BOX DE DESTAQUE: I2C0 COMPARTILHADO -->
    <g transform="translate(0, 315)">
      <rect width="310" height="52" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="12" y="18" font-weight="900" font-size="10.5" fill="#0369a1">📡 BARRAMENTO I2C0 COMPARTILHADO</text>
      <text x="12" y="34" font-weight="700" font-size="9.5" fill="#0c4a6e">• GP0 (SDA) + GP1 (SCL) ➔ BMP280 (0x76) + MPU6050 (0x68)</text>
    </g>
  </g>
</svg>
